<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F231B">
<title>Oche Show, fléchettes animées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEE9;--surface:#FFFFFF;--surface-2:#DCE5DE;--ink:#10241C;--muted:#55675E;
  --line:rgba(16,36,28,.13);--red:#C9302C;--green:#1C7D46;--red-soft:rgba(201,48,44,.13);
  --green-soft:rgba(28,125,70,.14);--key:#F5F8F6;--key-ink:#10241C;--on-accent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F231B;--surface:#173329;--surface-2:#1F4135;--ink:#F2EADB;--muted:#9FB3A8;
    --line:rgba(242,234,219,.11);--red:#E5483F;--green:#34B26A;--red-soft:rgba(229,72,63,.2);
    --green-soft:rgba(52,178,106,.2);--key:#1B3A2F;--key-ink:#F2EADB;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F231B;--surface:#173329;--surface-2:#1F4135;--ink:#F2EADB;--muted:#9FB3A8;
  --line:rgba(242,234,219,.11);--red:#E5483F;--green:#34B26A;--red-soft:rgba(229,72,63,.2);
  --green-soft:rgba(52,178,106,.2);--key:#1B3A2F;--key-ink:#F2EADB;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-y:auto}
body.in-game{overflow:hidden}
#app{height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.cond{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}

/* ---------- Accueil ---------- */
.home{max-width:560px;margin:0 auto;padding:0 16px 40px;position:relative;overflow-x:hidden}
.brand{position:relative;height:220px;display:flex;align-items:flex-end;padding-bottom:16px}
.brand .dboard{position:absolute;right:-100px;top:-30px;width:250px;height:250px;opacity:.9;transform:rotate(-9deg);
  animation:spin 1.1s cubic-bezier(.15,.85,.25,1) both;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
@keyframes spin{from{transform:rotate(-200deg) scale(.85);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.brand h1{font:800 64px/.85 'Barlow Condensed','Arial Narrow',sans-serif;margin:0;letter-spacing:-2px;position:relative}
.brand p{margin:8px 0 0;color:var(--muted);font-weight:500;position:relative;max-width:55%}
.group{margin-top:26px}
.group h2{font:700 24px/1.1 'Barlow Condensed','Arial Narrow',sans-serif;margin:0 0 10px 2px}
.card{background:var(--surface);border-radius:18px;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line)}
.pidx{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);
  font:700 15px 'Barlow Condensed',sans-serif;flex:none}
.prow input{flex:1;min-width:0;font:500 17px 'Barlow',sans-serif;border:0;background:transparent;color:inherit;padding:12px 0}
.x{width:40px;height:40px;border-radius:10px;font-size:24px;color:var(--muted)}
.pactions{display:flex}
.pactions button{flex:1;padding:14px;font-weight:600;color:var(--green)}
.pactions button+button{border-left:1px solid var(--line)}
.pactions button:disabled{color:var(--muted);opacity:.5}
.mode-row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.card>.mode-row:last-child,.card>.prow:last-child{border-bottom:0}
.badge{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;flex:none;
  font:700 19px 'Barlow Condensed',sans-serif;background:var(--surface-2);border-left:4px solid var(--red)}
.mode-row:nth-child(even) .badge{border-left-color:var(--green)}
.mtext{flex:1;min-width:0}
.mname{display:block;font-weight:600;font-size:17px}
.mdesc{display:block;color:var(--muted);font-size:14px;line-height:1.3}
.chev{color:var(--muted);font-size:24px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--green);color:var(--on-accent);border-radius:18px;padding:14px 16px;margin-top:6px}
.resume b{display:block;font:700 20px 'Barlow Condensed',sans-serif}
.resume small{display:block;opacity:.85;font-size:14px}
.resume span:last-child{font-size:26px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
.foot button{color:var(--muted);text-decoration:underline;padding:6px}

/* ---------- Feuilles ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .28s cubic-bezier(.2,.85,.25,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font:800 38px/.95 'Barlow Condensed',sans-serif;margin:0 0 8px}
.rules{color:var(--muted);font-size:15px;margin:0 0 18px;max-width:62ch}
.opt{margin-bottom:16px}
.opt label{display:block;font-weight:600;font-size:15px;margin:0 0 7px 2px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.primary{display:block;width:100%;padding:16px;border-radius:15px;background:var(--red);color:var(--on-accent);
  font:700 21px 'Barlow Condensed',sans-serif;margin-top:8px}
.primary.go{background:var(--green)}
.ghost{display:block;width:100%;padding:14px;border-radius:14px;background:var(--surface-2);font-weight:600;margin-top:8px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:4px 2px 0}
.rank{list-style:none;margin:6px 0 14px;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.rank li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rank .pos{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:700 16px 'Barlow Condensed',sans-serif}
.rank li:first-child .pos{background:var(--red);color:var(--on-accent)}
.rank .rn{flex:1;font-weight:600}
.rank .rv{font:700 26px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}

/* ---------- Partie ---------- */
.game{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;gap:6px;flex:none}
.bar .t{text-align:center;min-width:0}
.bar .t b{display:block;font:700 20px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{font-size:13px;color:var(--muted)}
.iconbtn{min-width:72px;height:44px;border-radius:12px;display:flex;align-items:center;gap:4px;padding:0 10px;font-weight:600;color:var(--muted)}
.iconbtn.r{justify-content:flex-end}
.iconbtn:disabled{opacity:.35}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.area{flex:1;overflow:auto;padding:2px 12px 12px;min-height:0}
.hero{background:var(--surface);border-radius:22px;padding:14px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pname{font:700 24px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font:800 clamp(64px,20vw,104px)/.88 'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:6px 0 2px}
.hero.bust .big{color:var(--red)}
.cap{color:var(--muted);font-size:14px;margin-bottom:12px;min-height:20px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border-radius:12px;background:var(--surface-2);padding:6px;text-align:center;min-height:54px;display:flex;flex-direction:column;justify-content:center}
.slot b{font:700 22px/1 'Barlow Condensed',sans-serif}
.slot small{color:var(--muted);font-size:12px;margin-top:2px}
.slot.empty{background:transparent;border:1.5px dashed var(--line)}
.slot.next{border-color:var(--green)}
.slot.m2{box-shadow:inset 0 -3px 0 var(--red)}
.slot.m3{box-shadow:inset 0 -3px 0 var(--green)}
.hint{margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);min-height:28px}
.chip{background:var(--green-soft);color:var(--green);font:700 17px 'Barlow Condensed',sans-serif;padding:2px 10px;border-radius:8px}
.pips{color:var(--red);letter-spacing:2px;font-size:15px}
.tag{display:inline-block;background:var(--red);color:var(--on-accent);font:700 13px 'Barlow Condensed',sans-serif;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.others{margin-top:10px;background:var(--surface);border-radius:18px;overflow:hidden}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.orow:last-child{border:0}
.orow.out{opacity:.42}
.oname{font-weight:600;display:block}
.osub{font-size:13px;color:var(--muted);display:block}
.oval{font:700 30px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctab{width:100%;border-collapse:collapse;margin-top:10px;background:var(--surface);border-radius:18px;overflow:hidden;table-layout:fixed}
.ctab th{font:700 15px 'Barlow Condensed',sans-serif;padding:8px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctab th small{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.ctab td{text-align:center;padding:3px 0;height:38px;border-top:1px solid var(--line)}
.ctab td.num,.ctab th.num{width:56px;background:var(--surface-2);font:700 21px 'Barlow Condensed',sans-serif}
.ctab .cur{background:var(--green-soft)}
.ctab tr.closed td{opacity:.32}
.mk{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;vertical-align:middle}
.mk.full{color:var(--green)}

.strip{display:grid;grid-template-columns:repeat(var(--n),minmax(74px,1fr));gap:6px;overflow-x:auto;margin:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sc{background:var(--surface);border-radius:14px;padding:6px 8px;text-align:center;border:2px solid transparent;min-width:0}
.sc.on{border-color:var(--green);background:var(--green-soft)}
.sc.out{opacity:.4}
.scn{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scv{display:block;font:700 26px/1.05 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.scv .pips{font-size:19px;letter-spacing:0;line-height:1.3}
.psub .pips{font-size:30px;letter-spacing:1px;line-height:1}
.oval .pips,.rv .pips{font-size:22px}
.scs{display:block;font-size:11px;color:var(--muted)}
.hero.compact .big,.hero.compact .cap,.hero.compact .hint:empty{display:none}
.hero.compact .slots{margin-top:10px}
.knum{display:block;font:800 30px/1 'Barlow Condensed',sans-serif}
.ktag{display:block;font:700 11px 'Barlow',sans-serif;color:var(--red);letter-spacing:.3px;text-transform:uppercase}
.reveal{background:var(--surface);border-radius:22px;padding:16px 18px;margin-bottom:10px}
.reveal h3{font:800 32px/1 'Barlow Condensed',sans-serif;margin:0 0 10px}
.reveal ul{list-style:none;margin:0;padding:0}
.reveal li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:18px}
.reveal li b{font:800 40px/1 'Barlow Condensed',sans-serif;color:var(--red);font-variant-numeric:tabular-nums}
.reveal p{margin:10px 0 0;color:var(--muted);font-size:14px}
.posl{margin:0 2px 8px;font-size:14px;color:var(--muted)}
.posl b{color:var(--ink)}
.pad{flex:none;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 10px 8px;display:flex;flex-direction:column;gap:7px;
  user-select:none;-webkit-user-select:none;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.mods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.mod{height:46px;border-radius:12px;font:700 19px 'Barlow Condensed',sans-serif;background:var(--surface-2)}
.mod.d[aria-pressed="true"]{background:var(--red);color:var(--on-accent)}
.mod.t[aria-pressed="true"]{background:var(--green);color:var(--on-accent)}
.mod:disabled{opacity:.35}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{height:clamp(44px,7vh,58px);border-radius:12px;background:var(--key);color:var(--key-ink);
  font:600 25px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;border:1px solid var(--line);transition:transform .07s,background .15s}
.k:active{transform:scale(.94)}
.k.dim{opacity:.36}
.nums.m2 .k{background:var(--red-soft)}
.nums.m3 .k{background:var(--green-soft)}
.extra{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px}
.k.small{font-size:21px}
.k.miss{color:var(--muted)}
.done{display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:calc(46px + 4 * clamp(44px,7vh,58px) + clamp(44px,7vh,58px) + 6 * 6px)}
.sum{font:800 44px/1 'Barlow Condensed',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.sum small{display:block;font:500 15px 'Barlow',sans-serif;color:var(--muted);margin-top:4px}
.sum.bust{color:var(--red)}

.lg{display:flex;gap:2px}
.acc{flex:none;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:14px}
.acc.on{background:var(--green-soft);color:var(--green)}
.iconbtn.sq{min-width:44px;padding:0;justify-content:center}
.iconbtn[aria-pressed="true"]{color:var(--green)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.srow b{display:block;font-weight:600}
.srow small{display:block;color:var(--muted);font-size:14px;line-height:1.3}
.sw{width:51px;height:31px;border-radius:16px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sw:disabled{opacity:.4}
.tarea{padding:12px 14px;border-bottom:1px solid var(--line)}
.tarea label{display:block;font-weight:600;font-size:15px;margin:4px 0 6px}
.tarea textarea{width:100%;font:400 16px/1.4 'Barlow',sans-serif;color:inherit;background:var(--surface-2);border:0;border-radius:12px;padding:10px 12px;resize:vertical;margin-bottom:10px}
.tarea small{color:var(--muted);font-size:13px}

.prow .acc{padding:6px 8px;font-size:13px}
.phb{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.phb img{width:100%;height:100%;object-fit:cover}
.phb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.fx{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 40px);color:#fff;text-align:center;
  background:radial-gradient(circle at 50% 40%,#2a4d40,#07130e 75%);animation:fxin .25s ease both;cursor:pointer}
.fx.out{animation:fxout .35s ease both}
@keyframes fxin{from{opacity:0}}
@keyframes fxout{to{opacity:0;transform:scale(1.04)}}
.fx .ttl{white-space:nowrap;font:800 clamp(52px,16.5vw,140px)/.9 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:-1px;position:relative;z-index:3;
  -webkit-text-stroke:3px rgba(0,0,0,.35);text-shadow:0 6px 0 rgba(0,0,0,.35)}
.fx .sub{font:600 21px/1.3 'Barlow',sans-serif;max-width:22ch;position:relative;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.fx .tapx{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:13px;opacity:.6}
.ava{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.4);position:relative;z-index:3;flex:none}
.ava.ini{display:grid;place-items:center;background:var(--red);font:800 48px 'Barlow Condensed',sans-serif;color:#fff}
.ava.big{width:130px;height:130px}
.zoom{animation:zoom .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes zoom{from{transform:scale(0) rotate(-25deg)}}
.slam{animation:slam .5s cubic-bezier(.2,1.5,.4,1) .45s both}
@keyframes slam{from{transform:scale(3);opacity:0}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) .7s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.fade{animation:fadeup 1s ease .3s both}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}}
.wobble{animation:wob .9s ease-in-out .2s both}
@keyframes wob{0%{transform:scale(0)}40%{transform:scale(1.1) rotate(-6deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}100%{transform:none}}
.shake{animation:fxin .2s both,shk .5s .1s both}
@keyframes shk{20%{transform:translate(-12px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(6px,-2px)}}
/* 180 */
.s-max{background:radial-gradient(circle at 50% 40%,#8a1414,#1a0303 75%)}
.s-max .ttl{color:#FFD54A}
.burst{position:absolute;width:0;height:0}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;opacity:0;animation:spark 1.2s ease-out both;animation-iteration-count:2}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(120px)}}
/* gros tour */
.s-great{background:radial-gradient(circle at 50% 35%,#1F8F4E,#06200f 75%)}
.target{width:190px;height:190px;animation:hit .4s ease .5s both;position:relative;z-index:1}
.target .dboard{width:100%;height:100%}
@keyframes hit{30%{transform:scale(.92) rotate(-4deg)}60%{transform:scale(1.04) rotate(2deg)}}
.fly{position:absolute;top:calc(50% - 110px);left:calc(50% - 130px);width:140px;z-index:2;animation:fly .5s cubic-bezier(.3,.1,.6,1) both}
.fly .dart{width:140px}
@keyframes fly{from{transform:translate(-80vw,40vh) rotate(-25deg)}}
/* désert */
.s-desert{background:linear-gradient(#F6C27A,#D9874A 60%,#A85A2D)}
.s-desert .sun{position:absolute;top:12%;right:14%;width:90px;height:90px;border-radius:50%;background:#FFE7A0;opacity:.85}
.s-desert .ground{position:absolute;left:0;right:0;bottom:22%;height:3px;background:rgba(80,40,10,.35)}
.weed{position:absolute;bottom:22%;left:-120px;width:110px;height:110px;fill:none;stroke:#6B4A2A;stroke-width:3;animation:roll 3.2s linear both}
@keyframes roll{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(30vw) translateY(-30px) rotate(270deg)}50%{transform:translateX(60vw) rotate(540deg)}75%{transform:translateX(90vw) translateY(-20px) rotate(810deg)}100%{transform:translateX(calc(100vw + 240px)) rotate(1080deg)}}

@keyframes ghost{0%{transform:translateY(60px);opacity:0}20%{opacity:1}50%{transform:translateY(-10px) rotate(-6deg)}80%{transform:translateY(-40px) rotate(6deg);opacity:1}100%{transform:translateY(-120px);opacity:.2}}
/* victoire */
.s-win{background:radial-gradient(circle at 50% 40%,#2a4d40,#061510 75%)}

.trophy{position:relative;width:150px;animation:rise .9s cubic-bezier(.2,1.4,.4,1) both}
.trophy svg{width:100%}

@keyframes rise{from{transform:translateY(60vh)}}
/* shanghai */
.s-shang{background:radial-gradient(circle at 50% 40%,#9b1b1b,#200303 75%)}

.lanterns i{width:46px;height:62px;margin-top:40px;border-radius:40%;background:#E5483F;box-shadow:0 0 30px #ff7b5a;transform-origin:50% -40px;animation:swing 1.4s ease-in-out infinite alternate}

  background:var(--ink);color:var(--bg);font-weight:600;padding:10px 18px;border-radius:999px;z-index:40;
  transition:opacity .2s,transform .25s;pointer-events:none;max-width:90%;text-align:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} };
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const val = d => d.n * d.m;
const fmt = x => (Math.round(x*10)/10).toFixed(1).replace('.', ',');
const avg3 = p => p.thrown ? fmt(p.pts / p.thrown * 3) : '0,0';
function slotLabel(d){ if(d.n===0) return 'Raté'; if(d.n===25) return d.m===2 ? 'Bull' : '25'; return (d.m===3?'T':d.m===2?'D':'S') + d.n; }
function chipLabel(d){ if(d.n===25) return d.m===2 ? 'Bull' : '25'; return (d.m===3?'T':d.m===2?'D':'') + d.n; }
const pips = (l, max) => max>5 ? `<span class="pips" aria-label="${l} vies sur ${max}">❤️ ${l}</span>` : `<span class="pips" aria-label="${l} vies">${'❤️'.repeat(l)}${'🤍'.repeat(Math.max(0,max-l))}</span>`;
const kMax = g => g.maxLives || g.opts.lives || 3;
let toastT;
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms||1800); }

/* ---------- Calcul des finitions X01 ---------- */
const R20 = Array.from({length:20},(_,i)=>20-i);
const SINGLES = R20.map(n=>({n,m:1})), TREBLES = R20.map(n=>({n,m:3})), DOUBLES = R20.map(n=>({n,m:2}));
const SETUP2 = [...SINGLES, {n:25,m:1}, ...TREBLES, {n:25,m:2}, ...DOUBLES];
const SETUP3 = [...TREBLES, {n:25,m:2}, {n:25,m:1}, ...SINGLES, ...DOUBLES];
const coCache = {};
function finishMap(out){
  const pref=[20,16,18,12,10,8,4,19,17,15,14,13,11,9,7,6,5,3,2,1];
  let f = pref.map(n=>({n,m:2})); f.push({n:25,m:2});
  if(out==='master') f = f.concat(TREBLES);
  if(out==='straight') f = f.concat(TREBLES, SINGLES, [{n:25,m:1}]);
  const m = new Map(); f.forEach(d=>{ const v=val(d); if(!m.has(v)) m.set(v,d); }); return m;
}
function checkout(score, k, out){
  if(score<=0 || k<=0 || score>180) return null;
  const key = score+'|'+k+'|'+out; if(key in coCache) return coCache[key];
  const F = finishMap(out); let res = null;
  if(F.has(score)) res=[F.get(score)];
  if(!res && k>=2){ const S=new Map(); SETUP2.forEach(d=>{ if(!S.has(val(d))) S.set(val(d),d); });
    for(const [fv,f] of F){ const r=score-fv; if(r>0 && S.has(r)){ res=[S.get(r),f]; break; } } }
  if(!res && k>=3) outer: for(const a of SETUP3){ const r1=score-val(a); if(r1<2) continue;
    for(const b of SETUP2){ const r=r1-val(b); if(r>0 && F.has(r)){ res=[a,b,F.get(r)]; break outer; } } }
  return coCache[key]=res;
}

/* ---------- Modes de jeu ---------- */
const CRT = [20,19,18,17,16,15,25];
const HR = [15,16,'D',17,18,'T',19,20,'B'];
const hrLabel = t => t==='D'?'un double':t==='T'?'un triple':t==='B'?'la bulle':t;
const MK = ['',
 '<svg class="mk" viewBox="0 0 24 24" aria-label="1 marque"><path d="M6 18L18 6"/></svg>',
 '<svg class="mk" viewBox="0 0 24 24" aria-label="2 marques"><path d="M6 18L18 6M6 6l12 12"/></svg>',
 '<svg class="mk full" viewBox="0 0 24 24" aria-label="fermé"><circle cx="12" cy="12" r="9.5"/><path d="M8 16l8-8M8 8l8 8"/></svg>'];

const MODES = {
  x01:{ name:'X01', badge:'501', desc:'Descendre à zéro pile.', title:g=>String(g.opts.start),
    rules:"Chaque joueur part du score choisi et le fait descendre. Il faut finir exactement à zéro. En sortie double, la dernière fléchette doit toucher un double (le centre à 50 compte) ; en sortie master, un double ou un triple. Passer sous zéro, ou rester à 1 sans sortie libre, annule le tour : c'est un bust.",
    opts:[{k:'start',l:'Score de départ',c:[[301,'301'],[501,'501'],[701,'701'],[901,'901']],d:501},
          {k:'in',l:'Entrée',c:[['straight','Libre'],['double','Double']],d:'straight'},
          {k:'out',l:'Sortie',c:[['straight','Libre'],['double','Double'],['master','Master']],d:'double'},
          {k:'legs',l:'Manches pour gagner',c:[[1,'1'],[2,'2'],[3,'3'],[5,'5']],d:1}],
    init(g){ g.players.forEach(p=>{ p.score=g.opts.start; p.opened=g.opts.in!=='double'; p.turnStart=p.score; p.turnPts=0; }); },
    dart(g,p,d){
      if(g.darts.length===1){ p.turnStart=p.score; p.turnPts=0; }
      p.thrown++;
      if(!p.opened){ if(d.m===2) p.opened=true; else return {}; }
      const v=val(d), out=g.opts.out, rem=p.score-v;
      const bust=()=>{ p.score=p.turnStart; p.pts-=p.turnPts; p.turnPts=0; return {bust:true}; };
      if(rem<0) return bust();
      if(rem===0){
        if(out==='straight' || (out==='double'&&d.m===2) || (out==='master'&&d.m>=2)){ p.score=0; p.pts+=v; return {win:true}; }
        return bust();
      }
      if(rem===1 && out!=='straight') return bust();
      p.score=rem; p.pts+=v; p.turnPts+=v; return {};
    },
    hero(g,p){ return { big:p.score, sub:`Moy. ${avg3(p)}`+(g.opts.legs>1?`, manches ${p.legs}/${g.opts.legs}`:''), cap:'' }; },
    row(g,p){ return { val:p.score, sub:`Moy. ${avg3(p)}`+(g.opts.legs>1?`, manches ${p.legs}`:'') }; },
    hint(g,p){
      if(!p.opened) return 'Ouvrez sur un double';
      if(g.turnDone) return '';
      const co=checkout(p.score,3-g.darts.length,g.opts.out);
      return co ? '<span>Finir :</span>'+co.map(d=>`<span class="chip">${chipLabel(d)}</span>`).join('') : '';
    },
    rank(g){ return [...g.players].sort((a,b)=>b.legs-a.legs||a.score-b.score); }
  },

  cricket:{ name:'Cricket', badge:'15–20', desc:'Fermer 15 à 20 et la bulle.', title:g=>({standard:'Cricket',cut:'Cut-throat',noscore:'Cricket sans points'})[g.opts.type],
    rules:"Seuls 15 à 20 et la bulle comptent. Trois marques ferment un numéro : simple = 1, double = 2, triple = 3 ; bulle 25 = 1, centre = 2. Sur un numéro fermé, chaque marque en plus rapporte sa valeur tant qu'un adversaire ne l'a pas fermé. Gagne celui qui ferme tout avec au moins autant de points que les autres. En cut-throat, les points vont aux adversaires et le score le plus bas gagne.",
    opts:[{k:'type',l:'Variante',c:[['standard','Classique'],['cut','Cut-throat'],['noscore','Sans points']],d:'standard'},
          {k:'limit',l:'Limite de tours',c:[[0,'Aucune'],[15,'15'],[20,'20']],d:0}],
    init(g){ g.players.forEach(p=>{ p.score=0; p.marks={}; CRT.forEach(n=>p.marks[n]=0); }); },
    dart(g,p,d){
      p.thrown++;
      if(!CRT.includes(d.n)) return {};
      const cur=p.marks[d.n], close=Math.min(3-cur,d.m), extra=d.m-close, t=g.opts.type;
      p.marks[d.n]+=close;
      const others=g.players.filter(o=>o!==p);
      if(extra>0 && t!=='noscore'){
        if(t==='standard'){ if(others.some(o=>o.marks[d.n]<3)) p.score+=extra*d.n; }
        else others.forEach(o=>{ if(o.marks[d.n]<3) o.score+=extra*d.n; });
      }
      if(CRT.every(n=>p.marks[n]>=3)){
        if(t==='noscore' || !others.length) return {win:true};
        if(t==='standard' && others.every(o=>p.score>=o.score)) return {win:true};
        if(t==='cut' && others.every(o=>p.score<=o.score)) return {win:true};
      }
      return {hit:d.m};
    },
    marks:p=>CRT.reduce((a,n)=>a+Math.min(3,p.marks[n]),0),
    hero(g,p){ const nm=g.opts.type==='noscore';
      return { big: nm ? CRT.filter(n=>p.marks[n]>=3).length+'/7' : p.score, cap: nm?'Numéros fermés':'Points', sub:`${this.marks(p)} marques` }; },
    row(g,p){ return { val: g.opts.type==='noscore' ? CRT.filter(n=>p.marks[n]>=3).length+'/7' : p.score, sub:`${this.marks(p)} marques` }; },
    hint(){ return ''; },
    board(g){
      const ps=g.players;
      let h='<table class="ctab"><thead><tr><th class="num"></th>'+ps.map((p,i)=>`<th class="${i===g.cur?'cur':''}">${esc(p.name)}${g.opts.type!=='noscore'?`<small>${p.score}</small>`:''}</th>`).join('')+'</tr></thead><tbody>';
      CRT.forEach(n=>{
        const closed=ps.length>1 && ps.every(p=>p.marks[n]>=3);
        h+=`<tr class="${closed?'closed':''}"><td class="num">${n===25?'Bull':n}</td>`+ps.map((p,i)=>`<td class="${i===g.cur?'cur':''}">${MK[Math.min(3,p.marks[n])]}</td>`).join('')+'</tr>';
      });
      return h+'</tbody></table>';
    },
    rel:()=>CRT,
    maxRounds:g=>g.opts.limit||0,
    rank(g){ const t=g.opts.type, mk=p=>this.marks(p);
      return [...g.players].sort((a,b)=> t==='noscore' ? mk(b)-mk(a) : t==='cut' ? (a.score-b.score||mk(b)-mk(a)) : (b.score-a.score||mk(b)-mk(a))); }
  },

  atc:{ name:'Tour de l’horloge', badge:'1→20', desc:'Toucher chaque numéro dans l’ordre.', title:()=>'Tour de l’horloge',
    rules:"Touchez le 1, puis le 2, et ainsi de suite jusqu'au 20, puis la bulle si l'option est active. Avec l'option « font avancer », un double fait sauter deux numéros et un triple trois. Le premier arrivé au bout gagne.",
    opts:[{k:'multi',l:'Doubles et triples',c:[[0,'Comptent 1'],[1,'Font avancer']],d:0},
          {k:'bull',l:'Finir sur la bulle',c:[[1,'Oui'],[0,'Non']],d:1}],
    init(g){ g.players.forEach(p=>{ p.t=1; }); },
    tn:p=>p.t>20?25:p.t,
    dart(g,p,d){
      p.thrown++;
      const tn=this.tn(p); if(d.n!==tn) return {};
      if(tn===25) return {win:true};
      p.t += g.opts.multi ? d.m : 1;
      if(p.t>20){ if(!g.opts.bull) return {win:true}; p.t=21; }
      return {hit:1};
    },
    hero(g,p){ return { big:this.tn(p)===25?'Bull':p.t, cap:'Cible', sub:`${p.thrown} fléchettes` }; },
    row(g,p){ return { val:this.tn(p)===25?'Bull':p.t, sub:`${p.thrown} fléchettes` }; },
    hint(){ return ''; },
    rel(g,p){ return [this.tn(p)]; },
    rank(g){ return [...g.players].sort((a,b)=>b.t-a.t||a.thrown-b.thrown); }
  },

  shanghai:{ name:'Shanghai', badge:'S', desc:'Un numéro à la fois, le Shanghai gagne.', title:g=>g.opts.rules==='classic'?'Shanghai':'Shanghai maison',
    rules:"Règles maison : chacun avance à son rythme en partant du 1. Au moins une touche sur son numéro : on passe au suivant. Un triple fait sauter deux cases de plus (triple 5 : on passe au 8). Trois fléchettes ratées : on redescend d'un numéro. Trois touches de suite : on avance et on rejoue tout de suite. Après le dernier numéro, il faut encore toucher le 25 puis le 50 pour finir : un triple 19 envoie donc directement au 50, et un triple 20 fait finir tout de suite. Le premier qui finit gagne. Règles classiques : tout le monde vise le 1 au tour 1, le 2 au tour 2, etc. ; le meilleur score à la fin gagne. Dans les deux cas, toucher le simple, le double et le triple du même numéro dans un tour (un Shanghai) fait gagner immédiatement.",
    opts:[{k:'rules',l:'Règles',c:[['maison','Maison'],['classic','Classiques']],d:'maison'},
          {k:'rounds',l:'Dernier numéro',c:[[7,'7'],[10,'10'],[20,'20']],d:20}],
    // Maison : cases 1 … dernier numéro, puis 25, puis 50, puis fini.
    tg(g,p){ if(g.opts.rules==='classic') return g.round; const L=g.opts.rounds; return p.t<=L ? p.t : p.t===L+1 ? 25 : 50; },
    lab(g,p){ const L=g.opts.rounds; return p.t>L+2 ? '✓' : p.t===L+1 ? '25' : p.t===L+2 ? '50' : p.t; },
    init(g){ g.players.forEach(p=>{ p.score=0; p.hm=[]; p.t=1; p.hits=0; }); },
    dart(g,p,d){
      p.thrown++;
      const t=this.tg(g,p);
      if(g.opts.rules!=='classic' && t===50 ? !(d.n===25 && d.m===2) : d.n!==t) return {};
      p.score+=val(d); p.hits=(p.hits||0)+1; if(d.m===3) p.tripled=true; if(!p.hm.includes(d.m)) p.hm.push(d.m);
      if(p.hm.length===3) return {win:true, note:'Shanghai !', shanghai:true};
      return {hit:1};
    },
    turnEnd(g,p){
      if(g.opts.rules!=='classic'){
        const h=p.hits||0;
        if(h===0){ if(p.t>1){ p.t--; g.note=`${p.name} redescend au ${p.t}`; } else g.note=`${p.name} reste au 1`; }
        else {
          const before=this.lab(g,p);
          p.t=Math.min(p.t+1+(p.tripled?2:0), g.opts.rounds+3);
          if(p.tripled) g.note=`Triple ! ${p.name} saute du ${before} au ${this.lab(g,p)}`;
          if(h>=3 && !this.finished(g,p)){ g.again=true; g.note=(p.tripled?g.note+'. ':'')+`${p.name} enchaîne trois touches et rejoue !`; }
        }
      }
      p.hm=[]; p.hits=0; p.tripled=false;
    },
    finished(g,p){ return g.opts.rules!=='classic' && p.t>g.opts.rounds+2; },
    hero(g,p){ return g.opts.rules==='classic'
      ? { big:p.score, cap:`Cible : ${g.round}`, sub:'' }
      : { big:this.lab(g,p), cap: p.t>g.opts.rounds ? (p.t===g.opts.rounds+1 ? 'Cible : la bulle 25, puis le 50 pour finir' : 'Cible : le 50 pour finir !') : `Cible, puis ${g.opts.rounds>p.t?'… '+g.opts.rounds+', ':''}25 et 50`, sub:`${p.score} pts` }; },
    row(g,p){ return g.opts.rules==='classic' ? { val:p.score, sub:'' } : { val:this.lab(g,p), sub:`${p.score} pts` }; },
    hint(g,p){ const t=this.tg(g,p); return `<span>Vise</span><span class="chip">${t===25?'Bull 25':t===50?'Bull 50':t}</span>`; },
    rel(g,p){ const t=this.tg(g,p); return [t===50?25:t]; },
    maxRounds:g=>g.opts.rules==='classic' ? g.opts.rounds : 0,
    rank(g){ return g.opts.rules==='classic' ? [...g.players].sort((a,b)=>b.score-a.score) : [...g.players].sort((a,b)=>b.t-a.t||b.score-a.score); }
  },


  killer:{ name:'Killer', badge:'K', desc:'Devenir tueur, puis éliminer les autres.', title:()=>'Killer', min:3,
    rules:"Au début, chaque joueur lance une fléchette avec sa main faible : le numéro touché devient le sien (1 à 20, un numéro par joueur, on relance si c'est raté ou déjà pris). Pour devenir tueur, il faut toucher le double de son propre numéro. Classique : 3 vies, et une fois tueur, chaque double touché sur le numéro d'un adversaire lui retire une vie. Variante 10 vies : une fois tueur, toucher le numéro d'un adversaire lui retire 1 vie en simple, 2 en double et 3 en triple. Le dernier joueur encore en vie gagne. 3 joueurs minimum, idéalement 4 à 6.",

    init(g){

function tock(miss){

  const o=c.createOscillator(), g=c.createGain();

  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.12);
  o.connect(g).connect(out); o.start(t); o.stop(t+.14);
}
function honk(c, out, t, d){
  // Klaxon à deux tons, comme une voiture (environ fa et la).
  const g=c.createGain(), lp=c.createBiquadFilter(), sh=c.createWaveShaper();
  const curve=new Float32Array(256); for(let i=0;i<256;i++){ const x=i/128-1; curve[i]=Math.tanh(3*x); } sh.curve=curve;
  lp.type='lowpass'; lp.frequency.value=2400;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.32,t+.015); g.gain.setValueAtTime(.32,t+d-.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  sh.connect(lp).connect(g).connect(out);
  [349,440].forEach(f=>{ const o=c.createOscillator(); o.type='square'; o.frequency.value=f; const og=c.createGain(); og.gain.value=.5; o.connect(og).connect(sh); o.start(t); o.stop(t+d+.02); });

function woaw(c, out, t, voices){
  // « Woaaw » : une voix synthétique qui passe du son « ou » au son « a », puis retombe.
  const D=1.1;
  for(let v=0; v<voices; v++){
    const st=t+Math.random()*.12, f0=(v%2?190:125)*(0.94+Math.random()*.12);
    const o=c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(f0*.85,st); o.frequency.linearRampToValueAtTime(f0*1.25,st+.35); o.frequency.linearRampToValueAtTime(f0*.8,st+D);
    const vib=c.createOscillator(), vg=c.createGain(); vib.frequency.value=5+Math.random()*1.5; vg.gain.value=f0*.02; vib.connect(vg); vg.connect(o.frequency);
    const env=c.createGain(), lvl=.5/Math.sqrt(voices);
    env.gain.setValueAtTime(.0001,st); env.gain.exponentialRampToValueAtTime(lvl,st+.12); env.gain.setValueAtTime(lvl,st+D*.65); env.gain.exponentialRampToValueAtTime(.0001,st+D);
    [[320,760,420,6],[800,1250,650,8]].forEach(([a,b,z,q])=>{
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q;
      bp.frequency.setValueAtTime(a,st); bp.frequency.linearRampToValueAtTime(b,st+.35); bp.frequency.linearRampToValueAtTime(z,st+D);
      const fg=c.createGain(); fg.gain.value=3; o.connect(bp).connect(fg).connect(env);
    });
    env.connect(out); o.start(st); o.stop(st+D+.05); vib.start(st); vib.stop(st+D+.05);
  }

}
function cheer(level){
  const c=ac(); if(!c) return 0; const t0=c.currentTime+.02, out=master(c,.85);
  if(level<.5){ honk(c,out,t0,.22); return .3; }
  const pattern = level>=1.4 ? [[0,.16],[.24,.16],[.48,.55]] : level>=.9 ? [[0,.18],[.28,.38]] : [[0,.3]];
  pattern.forEach(([d,len])=>honk(c,out,t0+d,len));
  const last=pattern[pattern.length-1], hornEnd=last[0]+last[1];
  const voices = level>=1.4 ? 7 : level>=.9 ? 4 : 2;
  const w = woaw(c,out,t0+hornEnd+.05,voices);
  return hornEnd+.05+w;
}

const HARSH_TAUNTS = ["{nom}, si la nullité tuait, on serait déjà à ton enterrement.","Même un mort lancerait mieux, {nom}. Et lui, au moins, il tremblerait pas.","{nom}, ton tour est une insulte à tous ceux qui ont déjà tenu une fléchette.","{nom}, t'es nul à chier. Et encore, je suis gentil avec les toilettes.","On devrait te retirer tes fléchettes pour usage dangereux, {nom}.","{nom}, même la Faucheuse refuse de t'emmener : elle a honte d'être vue avec toi.","Ton score, {nom}, il est tellement bas qu'il creuse sa propre tombe.","{nom}, à ton enterrement, personne voudra récupérer tes fléchettes.","Si ton tour était un chien, {nom}, on l'aurait fait piquer.","{nom}, t'as la précision d'un ivrogne en pleine tempête.","Bravo {nom}, t'as réussi à décevoir même ceux qui n'attendaient rien de toi.","{nom}, on t'aurait bien encouragé, mais même l'espoir a démissionné.","À ton enterrement, {nom}, on lancera des fléchettes sur ton cercueil. Et on le ratera, pour te rendre hommage.","{nom}, t'as deux mains et aucune des deux ne sert à rien.","Le jour où tu feras un bon tour, {nom}, on organisera une messe.","{nom}, même ton ombre a honte de te suivre.","C'est pas un tour, {nom}, c'est un avis de décès pour ta dignité.","{nom}, t'es la preuve vivante que l'évolution peut revenir en arrière.","Même ta mère a arrêté de regarder, {nom}.","{nom}, si t'étais un cheval, on t'aurait déjà abattu."];
const HARSH_CHEERS = ["{nom}, ce tour est tellement violent que les autres devraient porter plainte.","Les autres, rédigez vos testaments : {nom} est en mode boucher.","{nom} massacre la cible comme si elle lui devait de l'argent.","Enfin un bon tour, {nom}. On commençait à te commander un cercueil.","{nom} vient de commettre un meurtre. La victime : votre fierté à tous.","Appelez la morgue, {nom} vient de défoncer tout le monde."];
const HARSH_KILL = ["{a} a achevé {v} comme un vieux cheval. Personne n'a pleuré.","{v} est mort. Ses dernières paroles : je vais me refaire au prochain tour.","{a} vient de buter {v}. La police a classé l'affaire : c'était mérité.","{v} rejoint le cimetière des nuls. {a} a même pas eu besoin de viser.","Pas de minute de silence pour {v}. {a} a déjà oublié son nom."];
function joke(mood, nom){
  if(SET.dark && Math.random()<(SET.brutal?.5:.3)){
    const pool = mood==='cheer' ? [...DARK_CHEERS, ...(SET.brutal?HARSH_CHEERS:[])] : [...DARK_TAUNTS, ...(SET.brutal?HARSH_TAUNTS:[])];
    return rnd(pool).replace(/\{nom\}/g, nom);
  }
  const L = G && MODE_LINES[G.mode] && MODE_LINES[G.mode][mood];
  if(L && Math.random()<.5){
    const cible = G.mode==='shanghai' ? MODES.shanghai.tg(G, G.players[G.cur]) : G.mode==='bobs' ? (G.round<=20?'D'+G.round:'centre') : '';
    return rnd(L).replace(/\{nom\}/g, nom).replace(/\{cible\}/g, cible);
  }
  return mood==='cheer' ? praise(nom) : taunt(nom);
}
function react(kind, nom){
  if(!kind) return;
  hush();
  const snd = {
    max:()=>cheer(1.5), great:()=>cheer(1), good:()=>cheer(.4), bad:()=>boo(.5),
    zero:()=>{ trombone(); boo(.7); }, bust:()=>trombone(), kill:()=>cheer(.8),
    leg:()=>cheer(1.1), win:()=>cheer(1.6), shanghai:()=>cheer(1.6), end:()=>cheer(.8)
  }[kind];
  const mood = ({great:'cheer', good:'cheer', bad:'taunt', zero:'taunt', bust:'taunt'})[kind];
  // La phrase affichée sous l'animation est la même que celle dite par la voix.
  // Parfois, sur un mauvais tour : un pet à la place de la voix.
  const funny = SET.on && SET.fart, rr=Math.random(), badTurn = kind==='bad'||kind==='zero'||kind==='bust', isBig=['max','win','shanghai','leg','end'].includes(kind);
  const farting = funny && (kind==='bad'||kind==='zero') && rr<.25;
  // Parfois, un bruit rigolo juste avant la vanne (pet, canard, chien, loup…).
  const intro = !farting && funny && !isBig && mood ? (badTurn ? (rr<.6 ? rnd(FX_TAUNT) : null) : (rr<.35 ? rnd(FX_CHEER) : null)) : null;
  const line = farting ? fartLine(nom) : mood ? accentize(joke(mood, nom), nom, mood) : '';
  const spoken = {
    max:'Cent quatre-vingts !', great:line, good:line, bad:line, zero:line, bust:'Bust ! '+line,
    kill:`Au revoir ${nom} !`, leg:`Manche pour ${nom} !`, win:`Victoire de ${nom} !`,
    shanghai:`Shanghaï ! Victoire de ${nom} !`, end:'Partie terminée.'
  }[kind];
  if(SET.fx) showScene(kind, nom, line);
  else if(line && !['max','win','shanghai','leg','end'].includes(kind)) toast((mood==='cheer'?'👍 ':'👎 ')+line, 3200);
  if(!SET.on) return;
  // Soit la voix, soit le bruit : jamais les deux en même temps.
  const big = ['max','win','shanghai','leg','end'].includes(kind);
  if(farting){ fart(); return; }
  if(!big && SET.voice && spoken){ const d = intro ? intro() : 0; say(spoken, kind==='max'?.85:0, 0, intro ? null : snd, accOf(nom), d ? d+.1 : 0); }
  else if(intro) intro();
  else snd && snd();
}

let fxT=null;
function closeScene(){ clearTimeout(fxT); document.querySelectorAll('.fx').forEach(x=>x.remove()); }
function showScene(kind, nom, line){
  if(kind==='good'){ toast(`👍 ${line||praise(nom)}`, 3200); return; }
  if(kind==='bad'){ toast(`👎 ${line||taunt(nom)}`, 3200); return; }
  const mk=SCENES[kind]; if(!mk) return;
  closeScene();
  const bad=['zero','bust','bad'].includes(kind), good=['great','max','win'].includes(kind);
  const gifs = gifList(bad ? SET.gifBad : good ? SET.gifGood : '');
  const ov=document.createElement('div'); ov.setAttribute('role','status'); ov.setAttribute('aria-live','polite');

    sc={cls:'s-gif', dur:3800, html:`<img class="gif" src="${esc(rnd(gifs))}" alt=""><div class="sub pop">${esc(line)}</div>`};
  } else sc=mk(nom, line);
  ov.className='fx '+sc.cls; ov.innerHTML=sc.html+'<span class="tapx">Touchez pour fermer</span>';
  const img=ov.querySelector('img.gif'); if(img) img.onerror=()=>{ const f=mk(nom, line); ov.className='fx '+f.cls; ov.innerHTML=f.html; };

  document.body.appendChild(ov);
  fxT=setTimeout(()=>{ ov.classList.add('out'); setTimeout(()=>ov.remove(),350); }, sc.dur);

/* ---------- Moteur ---------- */
function newGame(modeId, opts, names){
  G = { mode:modeId, opts, players:names.map(n=>({name:n, legs:0, pts:0, thrown:0, out:false})),
        cur:0, starter:0, round:1, leg:1, darts:[], turnDone:false, bust:false, over:false, outSeq:0, note:'' };
  M().init(G); H=[]; mod=1; resultsHidden=false; screen='game'; sheet=null; save(); render();
  hush(); closeScene();
}
function throwDart(d){
  if(!G || G.over || G.turnDone || G.phase==='reveal') return;
  if(G.phase==='draw'){ buzz(); snap(); tock(d.n===0); mod=1; M().draw(G,d); save(); render(); return; }
  buzz(); snap(); G.note='';
  G.darts.push(d); mod=1;
  const p = G.players[G.cur];
  const r = M().dart(G,p,d) || {};
  G.turnHits = (G.turnHits||0) + (r.hit||0);
  tock(d.n===0);
  if(r.note) toast(r.note);
  if(r.win) return winLeg(r.winner || p, r.shanghai);
  if(r.bust){ G.bust=true; G.turnDone=true; }
  else if(r.endTurn || G.darts.length>=3) G.turnDone=true;
  save(); render();
  if(r.kill){ if(SET.fx===undefined || !SET.fx) reactRival(p.name, r.kill, true); else { react('kill', r.kill); reactRival(p.name, r.kill, true); } }
  else if(r.victim) reactRival(p.name, r.victim, false);
  else if(G.turnDone && !G.rivalSaid) react(rateTurn(), p.name);
}
function winLeg(p, shanghai){
  if(G.mode==='x01'){
    p.legs++;
    if(p.legs < G.opts.legs){
      const n=G.players.length;
      G.starter=(G.starter+1)%n; G.cur=G.starter; G.round=1; G.leg++;
      G.darts=[]; G.turnDone=false; G.bust=false; G.turnHits=0; M().init(G);
      save(); render(); toast(`Manche pour ${p.name}`); react('leg', p.name); return;
    }
  }
  endGame(p, shanghai);
}
function endGame(winner, shanghai){
  G.over=true; G.turnDone=true; resultsHidden=false;
  let r = M().rank(G);
  if(winner) r = [winner, ...r.filter(x=>x!==winner)];
  G.ranking = r.map(x=>G.players.indexOf(x));
  save(); render();
  react(shanghai ? 'shanghai' : G.players.length>1 ? 'win' : 'end', r[0].name);
}
function rateTurn(){
  // Chaque fin de tour reçoit une réaction : bonne ou mauvaise.
  const ds=G.darts, tot=ds.reduce((a,d)=>a+val(d),0), full=ds.length===3, h=G.turnHits||0;
  if(G.bust) return 'bust';
  if(G.mode==='x01' || G.mode==='countup'){
    if(tot===180) return 'max';
    if(tot===0) return 'zero';
    if(tot>=100) return 'great';
    if(tot>=45) return 'good';
    return 'bad';
  }
  if(G.mode==='killer') return h>=2 ? 'great' : h===1 ? 'good' : (full && ds.every(d=>d.n===0)) ? 'zero' : 'bad';
  if(full && h===0) return 'zero';
  if(G.mode==='cricket') return h>=6 ? 'great' : h>=2 ? 'good' : 'bad';
  return h>=3 ? 'great' : h>=1 ? 'good' : 'bad';
}
function nextIdx(from){ const n=G.players.length; for(let k=1;k<=n;k++){ const i=(from+k)%n; if(!G.players[i].out) return i; } return -1; }
function nextTurn(){
  if(!G || !G.turnDone || G.over) return;
  buzz(); snap();
  const p=G.players[G.cur];
  if(M().turnEnd) M().turnEnd(G,p);
  const note=G.note; G.note='';
  if(M().finished && M().finished(G,p)){ endGame(p); if(note) toast(note); return; }
  if(G.again){ G.again=false; G.darts=[]; G.turnDone=false; G.bust=false; G.turnHits=0; save(); render(); if(note) toast(note); return; }
  const ni=nextIdx(G.cur);
  if(ni===-1){ endGame(null); if(note) toast(note); return; }
  const n=G.players.length, pos=i=>(i-G.starter+n)%n;
  if(pos(ni)<=pos(G.cur)) G.round++;
  G.cur=ni; G.darts=[]; G.turnDone=false; G.bust=false; G.turnHits=0; G.rivalSaid=false;
  const mr = M().maxRounds ? M().maxRounds(G) : 0;
  if(mr && G.round>mr){ G.round=mr; endGame(null); if(note) toast(note); return; }
  save(); render(); if(note) toast(note);
}
function undo(){ if(!H.length) return; buzz(); hush(); closeScene(); G=JSON.parse(H.pop()); mod=1; resultsHidden=false; save(); render(); }

/* ---------- Rendu ---------- */
function boardSVG(){
  const order=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5], P=(r,a)=>[(r*Math.cos(a)).toFixed(2),(r*Math.sin(a)).toFixed(2)];
  const wedge=(r1,r2,a1,a2,f)=>{ const [x1,y1]=P(r2,a1),[x2,y2]=P(r2,a2),[x3,y3]=P(r1,a2),[x4,y4]=P(r1,a1);
    return `<path d="M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z" fill="${f}"/>`; };
  let s='', nums='';
  order.forEach((n,i)=>{
    const a1=(-99+i*18)*Math.PI/180, a2=a1+18*Math.PI/180, dk=i%2===0;
    const sc=dk?'#1B1A17':'#EADBC0', rc=dk?'#D6312F':'#1F8F4E';
    s+=wedge(94,100,a1,a2,rc)+wedge(63,94,a1,a2,sc)+wedge(57,63,a1,a2,rc)+wedge(16,57,a1,a2,sc);
    const am=(a1+a2)/2, [tx,ty]=P(108,am);
    nums+=`<text x="${tx}" y="${ty}" font-size="9" fill="#EADBC0" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed,sans-serif" font-weight="700">${n}</text>`;
  });
  return `<svg class="dboard" viewBox="-118 -118 236 236" aria-hidden="true"><circle r="118" fill="#141210"/>${s}<circle r="16" fill="#1F8F4E"/><circle r="6.4" fill="#D6312F"/>${nums}</svg>`;
}

      <div class="srow"><span><b>Sons</b><small>Klaxon, huées et trombone triste</small></span><button class="sw" role="switch" aria-checked="${SET.on}" aria-label="Sons" data-a="tog" data-k="on"></button></div>
      <div class="srow"><span><b>Bruits rigolos</b><small>Pets, canard, chien, loup… de temps en temps avant une vanne</small></span><button class="sw" role="switch" aria-checked="${SET.fart}" aria-label="Bruits de pet" data-a="tog" data-k="fart" ${SET.on?'':'disabled'}></button></div>
      <div class="srow"><span><b>Humour noir</b><small>Des vannes macabres de temps en temps (enterrements, Faucheuse…)</small></span><button class="sw" role="switch" aria-checked="${SET.dark}" aria-label="Humour noir" data-a="tog" data-k="dark"></button></div>
      <div class="srow"><span><b>Mode sans pitié</b><small>Humour noir plus méchant et plus fréquent. Entre potes uniquement.</small></span><button class="sw" role="switch" aria-checked="${SET.brutal}" aria-label="Mode sans pitié" data-a="tog" data-k="brutal" ${SET.dark?'':'disabled'}></button></div>
      <div class="srow"><span><b>Voix du commentateur</b><small>Une fois sur deux, la vanne est dite à voix haute à la place du bruit</small></span><button class="sw" role="switch" aria-checked="${SET.voice}" aria-label="Voix" data-a="tog" data-k="voice" ${SET.on?'':'disabled'}></button></div>
      <div class="tarea"><label for="ta-t">Phrases pour chambrer</label><textarea id="ta-t" data-k="taunts" rows="5">${esc(SET.taunts)}</textarea>
        <label for="ta-c">Phrases de félicitations</label><textarea id="ta-c" data-k="cheers" rows="4">${esc(SET.cheers)}</textarea>
        <small>Les phrases s'affichent sous l'animation. {nom} devient le nom du joueur ; « Prénom: » en début de ligne vise un seul joueur.</small></div>
      <div class="tarea"><label for="ta-gb">Mes GIF quand c'est beau</label><textarea id="ta-gb" data-k="gifGood" rows="2" placeholder="https://…gif">${esc(SET.gifGood)}</textarea>
        <label for="ta-gm">Mes GIF quand ça rate</label><textarea id="ta-gm" data-k="gifBad" rows="2" placeholder="https://…gif">${esc(SET.gifBad)}</textarea>
        <small>Facultatif. Collez un lien direct vers un GIF par ligne. Ils remplacent parfois les animations intégrées.</small></div>
      <div class="pactions"><button data-a="test" data-k="great">Gros tour</button><button data-a="test" data-k="zero">Triple zéro</button><button data-a="test" data-k="win">Victoire</button><button data-a="testv">Voix</button></div>
      <div class="pactions"><button data-a="testf">Prout</button><button data-a="testx" data-k="0">Chien</button><button data-a="testx" data-k="1">Loup</button><button data-a="testx" data-k="2">Canard</button></div>
      ${Object.keys(PHOTOS).length?'<div class="pactions"><button data-a="clrph">Retirer les photos</button></div>':''}
    </div></section>
    <p class="foot">Les parties sont enregistrées sur cet appareil.<br><button data-a="theme">Thème : ${({auto:'automatique',light:'clair',dark:'sombre'})[store.get('ocheg.theme','auto')]}</button></p>
  </main>`;
}

function slotsHTML(){
  let h='';
  for(let i=0;i<3;i++){
    const d=G.darts[i];
    if(d) h+=`<div class="slot m${d.m}${d.n===0?' m1':''}"><b>${slotLabel(d)}</b><small>${val(d)}</small></div>`;
    else h+=`<div class="slot empty${i===G.darts.length&&!G.turnDone?' next':''}"><b>&nbsp;</b><small>&nbsp;</small></div>`;
  }
  return `<div class="slots">${h}</div>`;
}

function gameHTML(){
  const m=M(), p=G.players[G.cur], hv=m.hero(G,p);
  const mr = m.maxRounds ? m.maxRounds(G) : 0;
  const sub = (G.mode==='x01' && G.opts.legs>1 ? `Manche ${G.leg}, ` : '') + (mr ? `tour ${G.round} sur ${mr}` : `tour ${G.round}`);
  const n=G.players.length;
  const below = m.board ? m.board(G) : '';
  let strip='';
  if(n>1){
    const rk = m.rank(G), tie = rk.length>1 && String(m.row(G,rk[0]).val)===String(m.row(G,rk[1]).val);
    const started = (G.round>1 || G.darts.length>0 || G.leg>1) && !tie;
    const lead = started ? rk[0] : null;
    const pos = m.rank(G).indexOf(p)+1;
    strip=m.board ? '' : `<div class="strip" role="list" aria-label="Scores de tous les joueurs" style="--n:${n}">${G.players.map((o,i)=>{ const r=m.row(G,o);
      return `<div class="sc${i===G.cur?' on':''}${o.out?' out':''}" role="listitem"><span class="scn">${o===lead?'<span aria-label="en tête">👑</span> ':''}${esc(o.name)}</span><span class="scv">${m.strip ? m.strip(G,o) : r.val}</span>${G.mode==='x01'&&G.opts.legs>1?`<span class="scs">${o.legs} manche${o.legs>1?'s':''}</span>`:''}</div>`; }).join('')}</div>`
      + (started ? `<p class="posl">${esc(p.name)} est ${pos===1?'<b>en tête</b>':`<b>${pos}e</b> sur ${n}`}</p>` : '');
  }
  return `<div class="game">
    <header class="bar">
      <div class="lg"><button class="iconbtn sq" data-a="menu" aria-label="Retour au menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="iconbtn sq" data-a="snd" aria-label="${SET.on?'Couper les sons':'Activer les sons'}" aria-pressed="${SET.on}">${SET.on?'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'}</button></div>
      <div class="t"><b>${esc(m.title(G))}</b><span>${sub.charAt(0).toUpperCase()+sub.slice(1)}</span></div>
      <button class="iconbtn r" data-a="undo" aria-label="Annuler la dernière action" ${H.length?'':'disabled'}>Annuler<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    </header>
    <div class="area">
      ${G.phase==='reveal' ? revealHTML() : ''}
      ${strip}
      <section ${G.phase==='reveal'?'hidden ':''}class="hero${G.bust?' bust':''}${m.board?' compact':''}" aria-live="polite">
        <div class="hero-top"><span class="pname">${esc(p.name)}</span><span class="psub">${hv.sub||''}</span></div>
        <div class="big">${G.bust?'Bust':hv.big}</div>
        <div class="cap">${hv.cap||''}</div>
        ${slotsHTML()}
        <div class="hint">${m.hint(G,p)}</div>
      </section>
      ${below}
    </div>
    ${padHTML()}
  </div>`;
}

function revealHTML(){
  return `<section class="reveal"><h3>Les numéros</h3><ul>${G.players.map(p=>`<li><span>${esc(p.name)}</span><b>${p.num}</b></li>`).join('')}</ul><p>Pour devenir tueur, touchez le double de votre numéro.</p></section>`;
}
function padHTML(){
  if(G.phase==='reveal'){
    return `<div class="pad"><div class="done"><div class="sum">Prêts ?<small>Chacun retient son numéro</small></div>
      <button class="primary go" data-a="kgo">C'est parti</button>
      ${G.opts.assign==='throw'?'<button class="ghost" data-a="undo">Corriger le dernier tirage</button>':''}</div></div>`;
  }
  if(G.turnDone && !G.over){
    const ni=nextIdx(G.cur), tot=G.darts.reduce((a,d)=>a+val(d),0); const pointsMode=['x01','countup','shanghai','halve'].includes(G.mode);
    const nextName = ni>-1 ? G.players[ni].name : '';
    const again = G.mode==='shanghai' && G.opts.rules!=='classic' && (G.players[G.cur].hits||0)>=3 && G.players[G.cur].t+1+(G.players[G.cur].tripled?2:0)<=G.opts.rounds+2;
    const same = ni===G.cur || again;
    return `<div class="pad"><div class="done">
      <div class="sum${G.bust?' bust':''}">${G.bust?'Bust':pointsMode?tot:(G.turnHits||0)}<small>${G.bust?'Le tour ne compte pas':pointsMode?'points ce tour':G.mode==='cricket'?((G.turnHits||0)>1?'marques ce tour':'marque ce tour'):((G.turnHits||0)>1?'touches utiles':'touche utile')}</small></div>
      <button class="primary go" data-a="next">${again?esc(G.players[G.cur].name)+' rejoue !':same?'Tour suivant':'Au tour de '+esc(nextName)}</button>
      <button class="ghost" data-a="undo">Corriger la dernière fléchette</button>
    </div></div>`;
  }
  if(G.over){
    return `<div class="pad"><div class="done">
      <div class="sum">Partie terminée</div>
      <button class="primary go" data-a="showres">Voir le classement</button>
      <button class="ghost" data-a="undo">Corriger la dernière fléchette</button>
    </div></div>`;
  }
  const rel = M().rel ? M().rel(G,G.players[G.cur]) : null;
  const dim = n => rel && !rel.includes(n) ? ' dim' : '';
  let keys=''; for(let n=1;n<=20;n++) keys+=`<button class="k${dim(n)}" data-a="n" data-n="${n}">${n}</button>`;
  return `<div class="pad">
    <div class="mods">
      <button class="mod d" data-a="mod" data-m="2" aria-pressed="${mod===2}">Double</button>
      <button class="mod t" data-a="mod" data-m="3" aria-pressed="${mod===3}">Triple</button>
      <button class="mod" data-a="undo" ${H.length?'':'disabled'}>Annuler</button>
    </div>
    <div class="nums m${mod}">${keys}</div>
    <div class="extra">
      <button class="k small${dim(25)}" data-a="n" data-n="25" ${mod===3?'disabled':''}>25</button>
      <button class="k small${dim(25)}" data-a="bull">Bull 50</button>
      <button class="k small miss" data-a="miss">Raté</button>
    </div>
  </div>`;
}

function sheetHTML(){
  if(sheet && sheet.type==='mode'){
    const m=MODES[sheet.id];
    const opts=m.opts.map(o=>`<div class="opt"><label>${o.l}</label><div class="seg" role="group" aria-label="${o.l}">${o.c.map(([v,l])=>`<button data-a="opt" data-k="${o.k}" data-v="${v}" aria-pressed="${sheet.draft[o.k]===v}">${l}</button>`).join('')}</div></div>`).join('');
    const tooFew = m.min && players.length<m.min;
    return `<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.name)}">
      <div class="grab"></div><h3>${m.name}</h3><p class="rules">${m.rules}</p>${opts}
      ${tooFew?`<p class="err">Ajoutez au moins ${m.min} joueurs pour ce mode.</p>`:''}
      <button class="primary" data-a="start" ${tooFew?'disabled':''}>Lancer la partie</button>
    </div></div>`;
  }
  if(screen==='game' && G && G.over && !resultsHidden){
    const m=M(), r=G.ranking.map(i=>G.players[i]), solo=G.players.length===1;
    const title = solo ? 'Partie terminée' : `Victoire de ${esc(r[0].name)}`;
    return `<div class="scrim" data-a="hideres"><div class="sheet" role="dialog" aria-modal="true" aria-label="Résultats">
      <div class="grab"></div><h3>${title}</h3>
      <ol class="rank">${r.map((p,i)=>{ const rv=m.row(G,p); return `<li><span class="pos">${i+1}</span><span class="rn">${esc(p.name)}${rv.sub?`<span class="osub">${rv.sub}</span>`:''}</span><span class="rv">${rv.val}</span></li>`; }).join('')}</ol>
      <button class="primary go" data-a="replay">Rejouer</button>
      <button class="ghost" data-a="menu">Menu</button>
      <button class="ghost" data-a="undo">Corriger la dernière fléchette</button>
    </div></div>`;
  }
  return '';
}

function render(){
  document.body.classList.toggle('in-game', screen==='game' && !!G);
  $('#app').innerHTML = screen==='game' && G ? gameHTML() : homeHTML();
  $('#sheet-root').innerHTML = sheetHTML();
}
function applyTheme(){ const t=store.get('ocheg.theme','auto'); if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }

/* ---------- Événements ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const a=b.dataset.a;
  if((a==='close'||a==='hideres') && e.target!==b) return;
  switch(a){
    case 'mode': { const m=MODES[b.dataset.id], draft={}; m.opts.forEach(o=>draft[o.k]=o.d); Object.assign(draft, lastOpts[b.dataset.id]||{}); sheet={type:'mode', id:b.dataset.id, draft}; render(); break; }
    case 'opt': { const o=MODES[sheet.id].opts.find(o=>o.k===b.dataset.k); const c=o.c.find(c=>String(c[0])===b.dataset.v); sheet.draft[o.k]=c[0]; render(); break; }
    case 'close': sheet=null; render(); break;
    case 'start': { lastOpts[sheet.id]={...sheet.draft}; store.set('ocheg.opts',lastOpts);
      const names=players.map((n,i)=>n.trim()||`Joueur ${i+1}`); newGame(sheet.id,{...sheet.draft},names); break; }
    case 'addp': players.push(`Joueur ${players.length+1}`); store.set('ocheg.players',players); render();
      setTimeout(()=>{ const ins=document.querySelectorAll('.prow input'); const l=ins[ins.length-1]; if(l){ l.focus(); l.select(); } },0); break;
    case 'delp': players.splice(+b.dataset.i,1); store.set('ocheg.players',players); render(); break;
    case 'shuf': players=shuffle(players); store.set('ocheg.players',players); render(); break;
    case 'resume': screen='game'; resultsHidden=false; render(); break;
    case 'menu': screen='home'; sheet=null; render(); window.scrollTo(0,0); break;
    case 'undo': undo(); break;
    case 'mod': { const v=+b.dataset.m; mod = mod===v ? 1 : v; buzz(); render(); break; }
    case 'n': { const n=+b.dataset.n; throwDart({n, m: n===25 ? Math.min(mod,2) : mod}); break; }
    case 'bull': throwDart({n:25,m:2}); break;
    case 'miss': throwDart({n:0,m:1}); break;
    case 'next': nextTurn(); break;
    case 'kgo': if(G && G.phase==='reveal'){ snap(); G.phase=null; G.cur=G.starter; save(); render(); } break;
    case 'showres': resultsHidden=false; render(); break;
    case 'hideres': resultsHidden=true; render(); break;
    case 'replay': { const names=G.players.map(p=>p.name); names.push(names.shift()); newGame(G.mode,{...G.opts},names); break; }
    case 'testf': if(!SET.on){ toast('Activez les sons pour tester'); break; } hush(); fart(); toast('💨 '+fartLine(players[0]||'Joueur 1'), 3000); break;
    case 'testx': if(!SET.on){ toast('Activez les sons pour tester'); break; } hush(); [bark,howl,quack][+b.dataset.k](); break;
    case 'snd': SET.on=!SET.on; saveSet(); if(!SET.on) hush(); else tock(false); render(); break;
    case 'tog': SET[b.dataset.k]=!SET[b.dataset.k]; saveSet(); if(!SET.on||!SET.voice) hush(); render(); break;
    case 'test': { const nom=players[0]||'Joueur 1'; react(b.dataset.k, nom); if(!SET.fx) toast('Activez les animations pour les voir'); break; }
    case 'acc': { const nom=players[+b.dataset.i]||''; const k=norm(nom); if(!k) break;
      const nx=ACC_NEXT[accOf(nom)]; if(nx) ACC[k]=nx; else delete ACC[k]; store.set('ocheg.accents',ACC); render();
      if(nx && SET.on && SET.voice) say(accentize(praise(nom), nom, 'cheer'), 0, 0, ()=>toast('La voix ne fonctionne pas ici'), nx);
      else if(nx) toast(`${nom} : accent ${ACC_NAME[nx]}`);
      break; }
    case 'testv': { hush(); say(pick(SET.taunts, DEF_TAUNTS, players[0]||'Joueur 1'), 0, 0, ()=>toast('La voix ne fonctionne pas ici : essayez dans Safari ou Chrome'), accOf(players[0]||'')); break; }
    case 'photo': { photoTarget=players[+b.dataset.i]||''; if(!norm(photoTarget)){ toast('Donnez un nom au joueur d’abord'); break; } $('#phin').value=''; $('#phin').click(); break; }
    case 'clrph': PHOTOS={}; store.set('ocheg.photos',PHOTOS); render(); toast('Photos retirées'); break;
    case 'theme': { const order=['auto','light','dark'], t=store.get('ocheg.theme','auto'); store.set('ocheg.theme',order[(order.indexOf(t)+1)%3]); applyTheme(); render(); break; }
  }
});
document.addEventListener('input', e=>{
  if(e.target.matches('.prow input')){ players[+e.target.dataset.i]=e.target.value; store.set('ocheg.players',players); }
  if(e.target.matches('.tarea textarea')){ SET[e.target.dataset.k]=e.target.value; saveSet(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.matches('.prow input') && e.key==='Enter') e.target.blur();
  if(e.key==='Escape' && sheet){ sheet=null; render(); }
});
let photoTarget='';
document.body.insertAdjacentHTML('beforeend','<input type="file" id="phin" accept="image/*" hidden>');
$('#phin').addEventListener('change', e=>{
  const f=e.target.files&&e.target.files[0]; if(!f || !photoTarget) return;
  const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const S=160, c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
    const k=Math.max(S/im.width,S/im.height), w=im.width*k, h=im.height*k; x.drawImage(im,(S-w)/2,(S-h)/2,w,h);
    PHOTOS[norm(photoTarget)]=c.toDataURL('image/jpeg',.82); store.set('ocheg.photos',PHOTOS); render(); toast(`Photo de ${photoTarget} ajoutée`);
  }; im.onerror=()=>toast('Cette image ne peut pas être lue'); im.src=r.result; };
  r.readAsDataURL(f);
});
applyTheme();
render();
</script>
</body>
</html>
